services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apix
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: apix
    ports:
      - "5432:5432"
    volumes:
      - apix_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  apix_pg:
